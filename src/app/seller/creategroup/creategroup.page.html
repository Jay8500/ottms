<ion-content class="cg-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" (click)="back()" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div>
    <button class="icon-btn dark" aria-label="Options">
      <ion-icon name="options-outline"></ion-icon>
    </button>
  </div>

  <h1 class="page-title">Share a Screen</h1>
  <p class="page-sub">Pick the platform you want to share and earn from.</p>

  <div class="tip">
    <ion-icon name="information-circle-outline"></ion-icon>
    <span>You keep one active group per platform. Admin checks your subscription proof before it goes live.</span>
  </div>

  <div class="app-grid">
    <button class="app" *ngFor="let a of apps" (click)="pick(a)">
      <app-ott-logo [brand]="a.brand" [imageUrl]="a.imageUrl" [size]="76" [radius]="14"></app-ott-logo>
      <span class="a-name">{{ a.title }}</span>
    </button>
  </div>

  <div class="skeleton" *ngIf="loading">
    <div class="sk" *ngFor="let i of [1,2,3,4,5,6]"></div>
  </div>

  <div class="state" *ngIf="error">
    <p>{{ error }}</p>
    <button class="retry" (click)="load()">Try again</button>
  </div>

  <div class="state" *ngIf="!loading && !error && !apps.length">
    <p>No platforms available yet.</p>
  </div>

  <div style="height:80px"></div>
</ion-content>
