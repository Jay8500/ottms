<ion-content class="cg-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="settings-outline"></ion-icon></button>
    <div class="tab-pills"><div class="pill active"></div><div class="pill"></div><div class="pill"></div></div>
    <button class="icon-btn dark"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="logo-center"><div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div></div>
  <p class="page-title">Create New Group</p>
  <div class="form-section">
    <p class="section-lbl">Account Validity</p>
    <label class="form-lbl">Select App</label>
    <div class="sel-wrap">
      <select [(ngModel)]="form.ottId" class="form-sel">
        <option value="" disabled>Select OTT App</option>
        <option *ngFor="let app of ottApps" [value]="app.id">{{ app.name }}</option>
      </select>
    </div>
    <label class="form-lbl">Validity</label>
    <div class="sel-wrap">
      <select [(ngModel)]="form.validity" class="form-sel">
        <option value="" disabled>Select Validity</option>
        <option value="1m">01 Month</option>
        <option value="3m">03 Months</option>
        <option value="6m">06 Months</option>
        <option value="12m">12 Months</option>
      </select>
    </div>
    <div class="date-row">
      <div><label class="form-lbl">From</label><input type="date" class="form-input" /></div>
      <div><label class="form-lbl">To</label><input type="date" class="form-input" /></div>
    </div>
    <label class="form-lbl">Select Plan</label>
    <div class="sel-wrap">
      <select [(ngModel)]="form.plan" class="form-sel">
        <option value="" disabled>(Mobile, Standard, Premium)</option>
        <option value="mobile">Mobile</option>
        <option value="standard">Standard</option>
        <option value="premium">Premium</option>
      </select>
    </div>
    <p class="section-lbl">Upload Membership Image</p>
    <div class="upload-box" (click)="uploadProof()">
      <ion-icon name="cloud-upload-outline"></ion-icon>
      <p class="up-text">Upload Image</p>
      <button class="up-btn" type="button">⬆ Upload</button>
      <p class="file-name" *ngIf="proofFile">✅ {{ proofFile.name }}</p>
    </div>
    <input type="file" #proofInput style="display:none" accept="image/*" (change)="onProofSelected($event)" />
    <div class="publish-row">
      <input type="checkbox" id="pub" checked />
      <label for="pub">Publish the Group</label>
    </div>
    <label class="form-lbl">Comment</label>
    <textarea class="comment-ta" placeholder="Enter your comment here..."></textarea>
  </div>
  <button class="create-btn" (click)="submitGroup()">Create</button>
</ion-content>
