<ion-content class="login-content">
  <div class="login-wrap">
    <button class="back-btn" (click)="back()" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="logo-area">
      <div class="logo-badge">
        <span class="money">Share</span>
        <span class="saver">OTT's</span>
      </div>
      <h1 class="brand-title">Reset Password</h1>
    </div>

    <div class="form-card">
      <ng-container *ngIf="step === 'mobile'">
        <p class="hint">Enter your mobile number — we'll email a code to the address on your account.</p>
        <div class="input-row">
          <ion-icon name="call-outline"></ion-icon>
          <input [(ngModel)]="mobile" type="tel" placeholder="Mobile Number" maxlength="10" inputmode="numeric" />
        </div>
        <p class="login-error" *ngIf="error">{{ error }}</p>
        <button class="yellow-btn full" [disabled]="loading" (click)="sendCode()">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          {{ loading ? 'Sending...' : 'Send Code' }}
        </button>
      </ng-container>

      <ng-container *ngIf="step === 'reset'">
        <p class="hint">Enter the 6-digit code emailed to you, and your new password.</p>
        <div class="input-row">
          <ion-icon name="key-outline"></ion-icon>
          <input [(ngModel)]="otp" type="tel" placeholder="6-digit code" maxlength="6" inputmode="numeric" />
        </div>
        <div class="input-row">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input [(ngModel)]="newPassword" [type]="showPassword ? 'text' : 'password'" placeholder="New Password" />
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" class="eye" (click)="showPassword=!showPassword"></ion-icon>
        </div>
        <div class="input-row">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input [(ngModel)]="confirmPassword" [type]="showPassword ? 'text' : 'password'" placeholder="Confirm New Password" />
        </div>
        <p class="login-error" *ngIf="error">{{ error }}</p>
        <button class="yellow-btn full" [disabled]="loading" (click)="reset()">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          {{ loading ? 'Resetting...' : 'Reset Password' }}
        </button>
        <p class="forgot" [class.disabled]="loading" (click)="!loading && resend()">Resend code</p>
      </ng-container>
    </div>
  </div>
</ion-content>
