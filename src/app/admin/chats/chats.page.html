<ion-content class="ac-content" [scrollY]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($any($event))">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline"></ion-refresher-content>
  </ion-refresher>

  <app-admin-header title="Chat's" trailing="options"></app-admin-header>

  <app-admin-searchbar
    placeholder="Search Chats..."
    [showSort]="false"
    [(term)]="term" (termChange)="apply()" (search)="apply()"
    [chips]="chips" [activeChip]="activeChip" (chipChange)="setChip($event)">
  </app-admin-searchbar>

  <!-- "Main is identifying the number sharing person" — every matching
       message, across every conversation, not just the current thread
       list's own fields. Numbers or names both work here. -->
  <div class="hit-list" *ngIf="messageHits.length">
    <p class="hit-h">Messages matching “{{ term }}”</p>
    <button class="hit-row" *ngFor="let h of messageHits" (click)="openHit(h)">
      <p class="hit-text">{{ h.text }}</p>
      <p class="hit-meta">{{ h.senderName }} ({{ h.senderUniqueNum }}) · {{ h.time }}</p>
    </button>
  </div>
  <p class="hit-loading" *ngIf="searchingMessages && !messageHits.length">Searching messages…</p>

  <div class="ac-list">
    <button class="ac-row" *ngFor="let c of shown" (click)="openThread(c)">
      <app-ott-logo *ngIf="c.isGroup" [brand]="c.brand!" [size]="50" [radius]="10"></app-ott-logo>
      <div class="ac-avatar" *ngIf="!c.isGroup">{{ c.peerName?.charAt(0) }}</div>

      <div class="ac-mid">
        <p class="ac-title">
          {{ title(c) }}
          <ion-icon name="lock-closed-outline" class="lock" *ngIf="c.locked"></ion-icon>
        </p>
        <p class="ac-seller" *ngIf="c.isGroup">{{ c.sellerName }} ({{ c.sellerUniqueNum }})</p>
        <p class="ac-last">{{ c.lastMessage }}</p>
      </div>

      <div class="ac-right">
        <span class="ac-time">{{ c.lastTime }}</span>
        <span class="ac-unread" *ngIf="c.unread">{{ c.unread }}</span>
        <span class="ac-dot" [class.on]="c.isOnline"></span>
      </div>
    </button>
  </div>

  <p class="empty" *ngIf="!shown.length">No chats match this filter.</p>
  <div style="height:100px"></div>
</ion-content>
