<ion-content class="dash-content" [scrollY]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($any($event))">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline"></ion-refresher-content>
  </ion-refresher>

  <app-admin-header leading="menu" trailing="options"
                    (menu)="openMenu()" (options)="openMenu()"></app-admin-header>

  <div class="dash-search">
    <div class="ds-input">
      <ion-icon name="search-outline"></ion-icon>
      <input [(ngModel)]="term" (ngModelChange)="filter()" placeholder="Search here..." />
    </div>
    <button class="ds-go" (click)="filter()">
      <ion-icon name="search-outline"></ion-icon><span>Search</span>
    </button>
  </div>

  <!-- At-a-glance numbers -->
  <div class="stat-row">
    <div class="stat">
      <span class="s-val">{{ statsLoading ? '—' : stats.totalUsers }}</span>
      <span class="s-lbl">Users</span>
    </div>
    <div class="stat">
      <span class="s-val">{{ statsLoading ? '—' : stats.activeSellers }}</span>
      <span class="s-lbl">Sellers</span>
    </div>
    <div class="stat">
      <span class="s-val">{{ statsLoading ? '—' : stats.activeScreens }}</span>
      <span class="s-lbl">Live groups</span>
    </div>
    <div class="stat alert" [class.quiet]="!stats.pendingGroups && !stats.pendingPayments">
      <span class="s-val">{{ statsLoading ? '—' : stats.pendingGroups + stats.pendingPayments }}</span>
      <span class="s-lbl">To review</span>
    </div>
  </div>

  <div class="feat-grid">
    <button class="feat" *ngFor="let f of filtered" (click)="open(f)">
      <span class="feat-badge" *ngIf="f.badge">{{ f.badge }}</span>
      <div class="feat-ico" [style.color]="f.tint"><ion-icon [name]="f.icon"></ion-icon></div>
      <span class="feat-lbl">{{ f.n }}. {{ f.label }}</span>
      <span class="feat-rule" [style.background]="f.accent"></span>
    </button>
  </div>

  <p class="no-hits" *ngIf="!filtered.length">No feature matches “{{ term }}”.</p>

  <div style="height:120px"></div>
</ion-content>

<ion-footer class="cta-footer">
  <button class="cta-btn" (click)="addNew()">
    <ion-icon name="add-circle-outline"></ion-icon> Add New
  </button>
</ion-footer>
