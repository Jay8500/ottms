<ion-header class="ion-no-border">
  <ion-toolbar class="admin-toolbar">
    <ion-title>Group Approvals</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ga-content">

  <div class="filter-row">
    <ion-segment [(ngModel)]="activeFilter" (ionChange)="filterGroups()" class="admin-segment">
      <ion-segment-button value="pending">Pending <ion-badge color="danger">{{ pendingCount }}</ion-badge></ion-segment-button>
      <ion-segment-button value="approved">Approved</ion-segment-button>
      <ion-segment-button value="rejected">Rejected</ion-segment-button>
    </ion-segment>
  </div>

  <div class="groups-list">
    <div class="group-card" *ngFor="let g of filteredGroups">
      <div class="group-top">
        <div class="group-logo" [style.background]="g.color">{{ g.initial }}</div>
        <div class="group-info">
          <h3>{{ g.ottName }} · {{ g.validity }}</h3>
          <p>Seller: <strong>{{ g.sellerName }}</strong></p>
          <p>{{ g.plan }} · ₹{{ g.price }}/screen · {{ g.screens }} screens</p>
        </div>
        <span class="status-pill" [ngClass]="g.status">{{ g.statusLabel }}</span>
      </div>

      <div class="proof-row" *ngIf="g.screenshotUrl">
        <ion-icon name="image-outline"></ion-icon>
        <span (click)="viewProof(g)">View Screenshot</span>
      </div>

      <div class="action-row" *ngIf="g.status === 'pending'">
        <ion-button expand="block" class="approve-btn" (click)="approve(g)">
          <ion-icon name="checkmark-outline" slot="start"></ion-icon> Approve
        </ion-button>
        <ion-button expand="block" fill="outline" class="reject-btn" color="danger" (click)="reject(g)">
          <ion-icon name="close-outline" slot="start"></ion-icon> Reject
        </ion-button>
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredGroups.length === 0">
      <ion-icon name="checkmark-done-circle-outline"></ion-icon>
      <p>No {{ activeFilter }} groups</p>
    </div>
  </div>

</ion-content>
