<ion-content class="page-content" [scrollY]="true">
  <div class="page-header">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></button>
    <div style="width:40px"></div>
  </div>
  <p class="page-title">Admin Page</p>
  <div class="filter-chips">
    <button class="chip" [class.active]="activeFilter==='pending'" (click)="activeFilter='pending';filterGroups()">
      👥 Pending Groups <span class="badge" *ngIf="pendingCount">{{ pendingCount }}</span>
    </button>
    <button class="chip" [class.active]="activeFilter==='approved'" (click)="activeFilter='approved';filterGroups()">🏅 Approved Groups</button>
    <button class="chip" [class.active]="activeFilter==='all'" (click)="activeFilter='all';filteredGroups=allGroups">✅ All Groups</button>
  </div>
  <p class="section-sub">Newly Created Sellers</p>
  <div class="list-area">
    <div class="card" *ngFor="let g of filteredGroups">
      <div class="g-top">
        <div class="g-logo" [style.background]="g.color">{{ g.initial }}</div>
        <div class="g-info">
          <p class="g-name">{{ g.ottName }} — {{ g.validity }}</p>
          <p class="g-seller">{{ g.sellerName }}</p>
          <div class="g-meta"><span>🟢 Online</span><span>Plan: {{ g.plan }}</span><span>₹{{ g.price }}</span></div>
        </div>
      </div>
      <div class="g-actions" *ngIf="g.status==='pending'">
        <button class="green-btn" (click)="approve(g)"><ion-icon name="checkmark-outline"></ion-icon> Approve</button>
        <button class="red-btn" (click)="reject(g)"><ion-icon name="trash-outline"></ion-icon> Delete</button>
      </div>
      <span class="status-badge" *ngIf="g.status!=='pending'" [class.approved]="g.status==='approved'" [class.rejected]="g.status==='rejected'">{{ g.statusLabel }}</span>
    </div>
  </div>
  <div style="height:80px"></div>
</ion-content>
