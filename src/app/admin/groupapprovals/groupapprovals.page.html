<ion-content class="ga-content" [scrollY]="true">
  <ion-refresher slot="fixed" (ionRefresh)="refresh($any($event))">
    <ion-refresher-content pullingIcon="chevron-down-circle-outline"></ion-refresher-content>
  </ion-refresher>

  <app-admin-header trailing="excel" (excel)="exportCsv()"></app-admin-header>

  <app-admin-searchbar
    placeholder="Search Groups..."
    [(term)]="term" (termChange)="apply()" (search)="apply()"
    [chips]="chips" [activeChip]="activeChip" (chipChange)="setChip($event)">
  </app-admin-searchbar>

  <!-- OTT Apps grid -->
  <div class="app-grid" *ngIf="activeChip === 'ott'">
    <button class="app-tile" *ngFor="let a of shownApps" (click)="openApp(a)">
      <app-ott-logo [brand]="a.brand" [size]="76" [radius]="14"></app-ott-logo>
      <span class="at-name">{{ a.title }}</span>
      <span class="at-rule" [style.background]="a.color"></span>
    </button>
  </div>

  <!-- Group cards -->
  <div class="ga-list" *ngIf="activeChip !== 'ott'">
    <div class="ga-card" *ngFor="let g of shown">
      <div class="ga-top">
        <div class="ga-avatar">{{ g.sellerName.charAt(0) }}</div>
        <app-ott-logo [brand]="g.brand" [size]="46" [radius]="9"></app-ott-logo>
        <div class="ga-mid">
          <p class="ga-name">{{ g.sellerName }} <span class="uid">({{ g.sellerUniqueNum }})</span></p>
          <p class="ga-dates">
            <ion-icon name="calendar-outline"></ion-icon>
            {{ g.dateFrom }} – {{ g.dateTo }}
          </p>
        </div>
        <button class="ga-chat" (click)="chat(g)">
          <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
          <span>Chat</span>
        </button>
      </div>

      <div class="ga-meta">
        <span class="chip months"><ion-icon name="calendar-outline"></ion-icon> {{ g.months }}M</span>
        <span class="chip seats"><ion-icon name="desktop-outline"></ion-icon> Screens {{ g.seatsFilled }}/{{ g.seatsTotal }}</span>
        <span class="chip tier">{{ g.tierLabel }}</span>
        <span class="chip flag" *ngFor="let f of g.flags">{{ f }}</span>
      </div>

      <div class="ga-actions">
        <button class="ga-btn del" (click)="remove(g)">
          <ion-icon name="trash-outline"></ion-icon> {{ g.status === 'pending' ? 'Reject' : 'Delete' }}
        </button>
        <button class="ga-btn ok" *ngIf="g.status === 'pending'" (click)="approve(g)">
          <ion-icon name="checkmark-circle-outline"></ion-icon> Approve
        </button>
        <button class="ga-btn img" (click)="viewProof(g)">
          <ion-icon name="image-outline"></ion-icon>
        </button>
      </div>
    </div>
  </div>

  <p class="empty" *ngIf="activeChip !== 'ott' && !shown.length">No groups match this filter.</p>
  <p class="empty" *ngIf="activeChip === 'ott' && !shownApps.length">No platform matches “{{ term }}”.</p>
  <div style="height:100px"></div>
</ion-content>
