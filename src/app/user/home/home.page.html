<ion-content class="home-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" (click)="openNotifications()"><ion-icon name="settings-outline"></ion-icon></button>
    <div class="tab-pills"><div class="pill active"></div><div class="pill"></div><div class="pill"></div></div>
    <button class="icon-btn dark" (click)="logout()"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="logo-center">
    <div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div>
  </div>
  <div class="home-actions">
    <button class="action-btn" (click)="goSupport()">
      <div class="btn-circle"><ion-icon name="headset-outline"></ion-icon></div>
      <span>Support</span>
    </button>
    <button class="action-btn" (click)="goCategory()">
      <div class="btn-circle"><ion-icon name="pricetag-outline"></ion-icon></div>
      <span>New Offer</span>
    </button>
    <button class="action-btn" *ngIf="isSeller" (click)="goCreateGroup()">
      <div class="btn-circle"><ion-icon name="add-circle-outline"></ion-icon></div>
      <span>Create Group</span>
    </button>
  </div>
  <div class="ott-grid">
    <button class="ott-item" *ngFor="let app of ottApps" (click)="selectApp(app)">
      <div class="ott-logo" [style.background]="app.color"><span>{{ app.initial }}</span></div>
    </button>
  </div>
  <div class="seller-row" *ngIf="!isSeller">
    <div class="seller-text">
      <p class="s-title">Become a Seller</p>
      <p class="s-sub">Share your OTT screens &amp; earn cashback</p>
    </div>
    <ion-toggle [(ngModel)]="sellerToggle" (ionChange)="toggleSeller($event)" class="yellow-toggle"></ion-toggle>
  </div>
  <div style="height:80px"></div>
</ion-content>
