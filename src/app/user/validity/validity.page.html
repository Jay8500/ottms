<ion-content class="vl-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" (click)="back()" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <div class="logo-badge"><span class="money">Share</span><span class="saver">OTT's</span></div>
    <button class="icon-btn dark" (click)="openMenu()" aria-label="Options">
      <ion-icon name="options-outline"></ion-icon>
    </button>
  </div>

  <h1 class="page-title">Select Validity</h1>

  <div class="app-banner" *ngIf="app" [style.background]="app.color">
    <app-ott-logo [brand]="app.brand" [imageUrl]="app.imageUrl" [size]="46" [radius]="9"></app-ott-logo>
    <span class="app-name">{{ app.title }}</span>
  </div>

  <div class="plan-list">
    <button class="plan" *ngFor="let v of plans"
            [class.on]="selectedId === v.id" (click)="select(v)">
      <div class="p-ico"><ion-icon [name]="v.icon"></ion-icon></div>
      <span class="p-name">{{ v.title }}</span>
      <span class="p-save" *ngIf="v.saveUpto">SAVE ₹{{ v.saveUpto }}</span>
      <span class="p-price">₹{{ v.amount | number }} <ion-icon name="chevron-forward-outline"></ion-icon></span>
    </button>
  </div>

  <div class="skeleton" *ngIf="loading">
    <div class="sk" *ngFor="let i of [1,2,3,4]"></div>
  </div>

  <div class="state" *ngIf="error">
    <p>{{ error }}</p>
    <button class="retry" (click)="load()">Try again</button>
  </div>

  <div class="state" *ngIf="!loading && !error && !plans.length">
    <p>No plans available yet.</p>
  </div>

  <div style="height:80px"></div>
</ion-content>
