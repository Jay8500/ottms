<ion-content class="sp-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" (click)="back()" aria-label="Back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <div class="logo-badge"><span class="money">Share</span><span class="saver">OTT's</span></div>
    <button class="icon-btn dark" (click)="openMenu()" aria-label="Options">
      <ion-icon name="options-outline"></ion-icon>
    </button>
  </div>

  <h1 class="page-title">Support</h1>

  <!-- Contact -->
  <div class="contact-row">
    <button class="contact" *ngIf="inAppChatEnabled" [disabled]="startingChat" (click)="openChat()">
      <div class="c-ico"><ion-icon name="chatbubbles-outline"></ion-icon></div>
      <span>{{ startingChat ? 'Opening…' : 'In-App Chat' }}</span>
    </button>
    <button class="contact" *ngFor="let l of links" (click)="openLink(l)">
      <div class="c-ico" [style.background]="l.color + '22'">
        <ion-icon [name]="l.icon" [style.color]="l.color"></ion-icon>
      </div>
      <span>{{ l.title }}</span>
    </button>
  </div>

  <!-- Language -->
  <div class="lang-row">
    <button *ngFor="let l of langs" [class.on]="lang === l.code" (click)="lang = l.code">
      {{ l.label }}
    </button>
  </div>

  <!-- FAQ -->
  <div class="faq-card" *ngIf="faqs.length">
    <p class="faq-h">Frequently Asked Questions</p>

    <div class="faq" *ngFor="let f of faqs; let i = index">
      <button class="faq-q" (click)="toggleOpen(f)">
        <span class="n">{{ i + 1 }}</span>
        <span class="q">{{ q(f) }}</span>
        <ion-icon [name]="f.open ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
      </button>

      <!-- Text and video both shown together, not a tap-to-switch toggle —
           reported as "show same like i sent pic ... show video also". -->
      <div class="faq-a" *ngIf="f.open">
        <p class="fallback" *ngIf="untranslated(f)">Shown in English — not translated yet.</p>

        <ul class="points">
          <li *ngFor="let p of points(f)">{{ p }}</li>
        </ul>

        <video *ngIf="videoLink[f.id]" [src]="videoLink[f.id]"
               controls autoplay muted playsinline class="faq-video"></video>
        <p class="fallback" *ngIf="video(f) && resolvingVideo && !videoLink[f.id]">Loading video…</p>
      </div>
    </div>
  </div>

  <div class="skeleton" *ngIf="loading">
    <div class="sk" *ngFor="let i of [1,2,3]"></div>
  </div>

  <div class="state" *ngIf="error">
    <p>{{ error }}</p>
    <button class="retry" (click)="load()">Try again</button>
  </div>

  <div class="state" *ngIf="!loading && !error && !faqs.length">
    <p>No help articles yet.</p>
  </div>

  <div style="height:80px"></div>
</ion-content>
