<ion-content class="wallet-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" (click)="withdraw()"><ion-icon name="settings-outline"></ion-icon></button>
    <p class="page-title">Wallet</p>
    <div style="width:40px"></div>
  </div>
  <div class="wallet-cards">
    <div class="wc total"><span class="wc-icon">🪙</span><p class="wc-lbl">Wallet Amount</p><p class="wc-amt">₹{{ totalAmount | number }}</p></div>
    <div class="wc locked"><span class="wc-icon">🔒</span><p class="wc-lbl">Locked Amount</p><p class="wc-amt">₹{{ lockedAmount | number }}</p></div>
    <div class="wc unlocked"><span class="wc-icon">🔓</span><p class="wc-lbl">Unlocked Amount</p><p class="wc-amt">₹{{ unlockedAmount | number }}</p></div>
  </div>
  <div class="filter-row">
    <button class="f-tab" [class.active]="activeTab==='all'"       (click)="activeTab='all';applyFilter()">All</button>
    <button class="f-tab" [class.active]="activeTab==='purchased'" (click)="activeTab='purchased';applyFilter()">Purchased</button>
    <button class="f-tab" [class.active]="activeTab==='sold'"      (click)="activeTab='sold';applyFilter()">Sale</button>
  </div>
  <div class="screens-list">
    <div class="sc-card" *ngFor="let s of displayScreens">
      <div class="sc-logo" [style.background]="s.color"><span>{{ s.initial }}</span></div>
      <div class="sc-info">
        <h3>{{ s.ottName }}</h3>
        <p class="sc-date">{{ s.date }} ({{ s.validity }})</p>
        <p class="sc-status" [class.active]="s.status==='active'" [class.expired]="s.status==='completed'">
          {{ s.status === 'active' ? '● Plan Active' : '● ' + s.statusLabel }}
        </p>
      </div>
      <div class="sc-btns">
        <button class="sc-btn" (click)="openChat(s)"><ion-icon name="chatbubble-outline"></ion-icon></button>
        <button class="sc-btn" (click)="openRating(s)" *ngIf="!s.rated"><ion-icon name="star-outline"></ion-icon></button>
      </div>
    </div>
  </div>
  <div style="height:80px"></div>
</ion-content>
