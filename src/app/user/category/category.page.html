<ion-header class="ion-no-border">
  <ion-toolbar class="ms-toolbar">
    <ion-title>Categories</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cat-content">
  <div class="search-wrap">
    <ion-searchbar
      placeholder="Search categories..."
      [(ngModel)]="searchTerm"
      (ionInput)="filterCategories()"
      class="ms-searchbar"
    ></ion-searchbar>
  </div>

  <div class="section-label">All Membership Categories</div>

  <div class="cat-grid">
    <div
      class="cat-card"
      *ngFor="let cat of filteredCategories"
      (click)="openCategory(cat)"
    >
      <div class="cat-icon-wrap" [style.background]="cat.bgColor">
        <span class="cat-emoji">{{ cat.emoji }}</span>
      </div>
      <div class="cat-info">
        <h3 class="cat-name">{{ cat.name }}</h3>
        <p class="cat-count">{{ cat.appCount }} apps available</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="cat-arrow"></ion-icon>
    </div>
  </div>
</ion-content>
