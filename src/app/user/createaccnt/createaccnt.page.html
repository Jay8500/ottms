<ion-content class="ca-content" [scrollY]="true">
  <div class="ca-wrap">
    <div class="logo-area">
      <div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div>
      <h1 class="brand-title">Create <span class="blue">Account</span></h1>
    </div>

    <button class="avatar-btn" (click)="pickAvatar()">
      <img *ngIf="avatarPreview" [src]="avatarPreview" alt="Your photo" />
      <ion-icon *ngIf="!avatarPreview" name="camera-outline"></ion-icon>
      <span class="av-plus"><ion-icon name="add-outline"></ion-icon></span>
    </button>
    <input type="file" #avatarInput hidden accept="image/*" (change)="onAvatarSelected($event)" />

    <div class="form-card">
      <div class="input-row" *ngFor="let f of fields">
        <ion-icon [name]="f.icon"></ion-icon>
        <input
          [(ngModel)]="values[f.id]"
          [type]="f.type === 'password' ? (showPwd ? 'text' : 'password') : f.type"
          [placeholder]="f.placeholder + (f.required ? ' *' : '')"
          [attr.maxlength]="f.type === 'tel' ? 10 : null"
          [attr.inputmode]="f.type === 'tel' ? 'numeric' : null"
          autocapitalize="off" />
        <ion-icon
          *ngIf="f.type === 'password'"
          [name]="showPwd ? 'eye-off-outline' : 'eye-outline'"
          class="eye" (click)="showPwd = !showPwd"></ion-icon>
      </div>

      <p class="ca-error" *ngIf="error">{{ error }}</p>

      <p class="ca-empty" *ngIf="!fields.length && !error">Loading the form…</p>

      <button class="yellow-btn full" [disabled]="loading || !isValid" (click)="createAccount()">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{ loading ? 'Creating…' : 'Create Account' }}
      </button>

      <p class="have-acct" (click)="goLogin()">Already have an account? <b>Sign In</b></p>
    </div>
  </div>
</ion-content>
