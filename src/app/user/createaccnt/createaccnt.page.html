<ion-content class="ca-content" [scrollY]="true">
  <div class="ca-wrap">
    <div class="logo-area">
      <div class="logo-badge"><span class="money">Share</span><span class="saver">OTT's</span></div>
      <h1 class="brand-title">Create <span class="blue">Account</span></h1>
    </div>

    <!-- The photo picker is removed until it actually uploads. It only ever
         set a local preview — the file was discarded on submit, so the user
         chose a picture and silently got no picture. Restoring it needs a
         storage bucket, an upload, and avatar_url written to the profile. -->

    <div class="form-card">
      <div class="input-row" *ngFor="let f of fields">
        <ion-icon [name]="f.icon"></ion-icon>
        <input
          [(ngModel)]="values[f.id]"
          [type]="f.type === 'password' ? (showPwd ? 'text' : 'password') : f.type"
          [placeholder]="f.placeholder + (f.required ? ' *' : '')"
          [attr.maxlength]="f.type === 'tel' ? 10 : null"
          [attr.inputmode]="f.type === 'tel' ? 'numeric' : null"
          autocapitalize="off" />
        <ion-icon
          *ngIf="f.type === 'password'"
          [name]="showPwd ? 'eye-off-outline' : 'eye-outline'"
          class="eye" (click)="showPwd = !showPwd"></ion-icon>
      </div>

      <p class="ca-error" *ngIf="error">{{ error }}</p>

      <p class="ca-empty" *ngIf="!fields.length && !error">Loading the form…</p>

      <!-- Only disabled while the request is in flight. Disabling it on an
           invalid form left the user tapping a dead button with nothing on
           screen, because the message explaining why lives in
           createAccount(). Let the tap through so it can say what is wrong. -->
      <button class="yellow-btn full" [disabled]="loading" (click)="createAccount()">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        {{ loading ? 'Creating…' : 'Create Account' }}
      </button>

      <p class="have-acct" (click)="goLogin()">Already have an account? <b>Sign In</b></p>
    </div>
  </div>
</ion-content>
