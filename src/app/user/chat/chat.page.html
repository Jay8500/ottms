<ion-header class="ion-no-border">
  <ion-toolbar class="ms-toolbar">
    <ion-buttons slot="start"><ion-back-button defaultHref="/user/wallet"></ion-back-button></ion-buttons>
    <ion-title>
      <div class="chat-title">
        <span class="peer-name">{{ peerName }}</span>
        <span class="peer-status" [class.online]="peerOnline">{{ peerOnline ? 'Online' : 'Offline' }}</span>
      </div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleLock()">
        <ion-icon [name]="locked ? 'lock-closed-outline' : 'lock-open-outline'" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-content" #scrollArea>
  <div class="info-banner" *ngIf="showBanner">
    <ion-icon name="information-circle-outline"></ion-icon>
    <p>Share credentials <strong>only after</strong> payment is confirmed.</p>
    <ion-icon name="close-outline" class="close-btn" (click)="showBanner=false"></ion-icon>
  </div>

  <div class="lock-banner" *ngIf="locked">
    <ion-icon name="lock-closed-outline"></ion-icon>
    <span>Chat locked — only suggested texts can be sent.</span>
  </div>

  <div class="msg-list">
    <div *ngFor="let m of messages" class="msg-wrap" [class.mine]="m.isMine" [class.theirs]="!m.isMine">
      <div class="bubble" [class.mine]="m.isMine" [class.theirs]="!m.isMine">
        <p class="bubble-text">{{ m.text }}</p>
        <span class="bubble-time">{{ m.time }}</span>
      </div>
    </div>
  </div>
</ion-content>

<div class="suggested-strip">
  <div class="suggested-inner">
    <button class="sug-chip" *ngFor="let s of suggestedTexts" (click)="sendSuggested(s)">{{ s }}</button>
  </div>
</div>

<ion-footer class="chat-footer">
  <div class="input-row">
    <button class="icon-btn" (click)="attachImage()"><ion-icon name="image-outline"></ion-icon></button>
    <ion-input [(ngModel)]="draft" placeholder="Type a message..." class="msg-input"
      [disabled]="locked" (keyup.enter)="send()"></ion-input>
    <button class="send-btn" (click)="send()" [disabled]="!draft.trim() || locked">
      <ion-icon name="send-outline"></ion-icon>
    </button>
  </div>
</ion-footer>
