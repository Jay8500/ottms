<ion-content class="payment-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></button>
    <div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div>
    <button class="icon-btn"><ion-icon name="help-circle-outline"></ion-icon></button>
  </div>
  <p class="page-title">Make Payment</p>
  <div class="qr-card">
    <div class="qr-box"><ion-icon name="qr-code-outline"></ion-icon></div>
    <p class="qr-label">Scan QR Code to Pay</p>
  </div>
  <div class="upi-info">
    <div class="info-row"><span class="lbl">Name</span><span class="val">John Doe</span></div>
    <div class="info-row">
      <span class="lbl">UPI ID</span>
      <div class="val-copy"><span class="val">moneysaver@upi</span><button class="copy-btn" (click)="copyUpi()">📋 Copy</button></div>
    </div>
    <div class="info-row">
      <span class="lbl">UPI Mobile</span>
      <div class="val-copy"><span class="val">+91 98765 43210</span><button class="copy-btn" (click)="copyUpi()">📋 Copy</button></div>
    </div>
    <div class="info-row"><span class="lbl">Bank</span><span class="val">🏦 XYZ Bank • **** 1234</span></div>
  </div>
  <div class="divider-lbl">After Payment</div>
  <div class="after-section">
    <div class="amount-row"><label>Amount Paid</label><input type="number" placeholder="Enter amount" /></div>
    <div class="upload-area" (click)="uploadScreenshot()">
      <ion-icon name="cloud-upload-outline"></ion-icon>
      <p class="up-title">Upload Payment Screenshot</p>
      <p class="up-sub">Please upload your payment receipt</p>
      <button class="choose-btn" type="button">📎 Choose File</button>
      <p class="file-hint">Accepted: JPG, PNG, PDF (Max 5MB)</p>
      <p class="file-name" *ngIf="screenshotFile">✅ {{ screenshotFile.name }}</p>
    </div>
    <input type="file" #fileInput style="display:none" accept="image/*,.pdf" (change)="onFileSelected($event)" />
  </div>
  <button class="submit-btn" (click)="submitPayment()"><ion-icon name="send-outline"></ion-icon> Submit Payment</button>
  <div style="height:40px"></div>
</ion-content>
