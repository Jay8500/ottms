<ion-content class="ott-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="settings-outline"></ion-icon></button>
    <span class="page-name">{{ categoryName }}</span>
    <button class="icon-btn dark"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="banner-bar"><span class="banner-emoji">🎬</span><span class="banner-title">{{ categoryName }}</span></div>
  <div class="ott-grid">
    <button class="ott-item" *ngFor="let app of filtered" (click)="selectApp(app)">
      <div class="ott-logo" [style.background]="app.color"><span>{{ app.initial }}</span></div>
    </button>
  </div>
  <div style="height:80px"></div>
</ion-content>
