<ion-content class="sellers-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="settings-outline"></ion-icon></button>
    <div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div>
    <button class="icon-btn dark"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="filter-row">
    <button class="f-chip" *ngFor="let f of filters" [class.active]="activeFilter===f.key" (click)="setFilter(f.key)">
      <ion-icon [name]="f.icon" *ngIf="f.icon"></ion-icon> {{ f.label }}
    </button>
  </div>
  <div class="sellers-list">
    <div class="seller-card" *ngFor="let s of filteredSellers">
      <div class="s-av">{{ s.name.charAt(0) }}</div>
      <div class="s-info">
        <p class="s-name">{{ s.name }} <span class="uid">{{ s.uniqueNum }}</span>
          <ion-icon name="shield-checkmark-outline" class="verified" *ngIf="s.isVerified"></ion-icon>
        </p>
        <div class="stars">
          <span *ngFor="let x of getStars(s.rating,'filled')" class="star">★</span>
          <span *ngFor="let x of getStars(s.rating,'empty')" class="star empty">☆</span>
          <span class="rc">{{ s.reviewCount }}</span>
        </div>
        <div class="online-row">
          <span class="dot" [class.online]="s.isOnline"></span>
          <span>{{ s.isOnline ? 'Online' : 'Offline' }}</span>
          <span class="batch" *ngFor="let b of s.batches">{{ b }}</span>
        </div>
      </div>
      <button class="price-btn" (click)="selectSeller(s)">₹{{ s.price }} &gt;</button>
    </div>
  </div>
  <div style="height:80px"></div>
</ion-content>
