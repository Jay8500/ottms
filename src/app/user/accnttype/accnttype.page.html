<ion-content class="at-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></button>
    <div class="tab-pills"><div class="pill active"></div><div class="pill"></div><div class="pill"></div></div>
    <button class="icon-btn dark"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="logo-center"><div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div></div>
  <div class="app-banner" [style.background]="ottColor">
    <span class="app-name">{{ ottName }}</span>
  </div>
  <p class="select-label">Select Option Below</p>
  <div class="action-grid">
    <button class="action-card purchase" (click)="navigate('purchase')">
      <ion-icon name="cart-outline"></ion-icon>
      <span class="ac-label">Purchase</span>
      <span class="ac-sub">Private Screen</span>
    </button>
    <button class="action-card share" (click)="navigate('share')">
      <ion-icon name="people-outline"></ion-icon>
      <span class="ac-label">Share</span>
      <span class="ac-sub">Personal Screen</span>
    </button>
  </div>

  <div style="height:80px"></div>
</ion-content>
