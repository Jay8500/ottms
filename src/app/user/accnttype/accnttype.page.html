<ion-header class="ion-no-border">
  <ion-toolbar class="ms-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/user/category"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ ottName }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="at-content">
  <div class="app-hero">
    <div class="app-logo" [style.background]="ottColor">{{ ottInitial }}</div>
    <h2>{{ ottName }}</h2>
    <p>Select what you'd like to do</p>
  </div>

  <div class="action-list">
    <div class="action-card" (click)="navigate('purchase')">
      <div class="ac-icon purchase">
        <ion-icon name="cart-outline"></ion-icon>
      </div>
      <div class="ac-body">
        <h3>Purchase Screen</h3>
        <p>Buy a shared screen slot from a verified seller</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="ac-arrow"></ion-icon>
    </div>

    <div class="action-card seller-card" (click)="navigate('share')" *ngIf="isSeller">
      <div class="ac-icon share">
        <ion-icon name="share-social-outline"></ion-icon>
      </div>
      <div class="ac-body">
        <h3>Share / Sell Screen</h3>
        <p>List your remaining screen slots for buyers</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="ac-arrow"></ion-icon>
    </div>
  </div>

  <div class="seller-hint" *ngIf="!isSeller">
    <ion-icon name="information-circle-outline"></ion-icon>
    <p>Enable <strong>Seller Mode</strong> on Home to share your screens.</p>
  </div>
</ion-content>
