<ion-content class="page-content" [scrollY]="true">
  <div class="page-header">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></button>
    <div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div>
    <div style="width:40px"></div>
  </div>
  <p class="page-title">Admin Page</p>
  <div class="search-row">
    <div class="search-box"><ion-icon name="search-outline"></ion-icon><input [(ngModel)]="searchTerm" (ngModelChange)="filterUsers()" placeholder="Search..." /></div>
    <select [(ngModel)]="roleFilter" (ngModelChange)="filterUsers()" class="role-sel">
      <option value="all">All</option><option value="buyer">Buyer</option><option value="seller">Seller</option>
    </select>
  </div>
  <div class="list-area">
    <div class="card" *ngFor="let u of filteredUsers">
      <div class="user-top">
        <div class="u-av">{{ u.name.charAt(0) }}</div>
        <div class="u-info">
          <p class="u-name">{{ u.name }} <span class="uid">{{ u.uniqueNum }}</span></p>
          <p class="u-mobile">{{ u.mobile }}</p>
          <p class="u-email">{{ u.email }}</p>
        </div>
        <span class="role-badge" [class.seller]="u.role==='seller'">{{ u.roleLabel }}</span>
      </div>
      <div class="u-actions">
        <button class="yellow-sm" (click)="editUser(u)"><ion-icon name="create-outline"></ion-icon> Edit</button>
        <button class="red-sm" (click)="deleteUser(u)"><ion-icon name="trash-outline"></ion-icon> Delete</button>
      </div>
    </div>
  </div>
  <div style="height:80px"></div>
</ion-content>
