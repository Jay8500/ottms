<ion-content class="at-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="arrow-back-outline"></ion-icon></button>
    <div class="tab-pills"><div class="pill active"></div><div class="pill"></div><div class="pill"></div></div>
    <button class="icon-btn dark"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="logo-center"><div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div></div>
  <div class="app-banner" [style.background]="ottColor">
    <span class="app-name">{{ ottName }}</span>
  </div>
  <p class="select-label">Select Option Below</p>
  <div class="action-grid">
    <button class="action-card purchase" (click)="navigate('purchase')">
      <ion-icon name="cart-outline"></ion-icon>
      <span class="ac-label">Purchase</span>
      <span class="ac-sub">Private Screen</span>
    </button>
    <button class="action-card share" (click)="navigate('share')">
      <ion-icon name="people-outline"></ion-icon>
      <span class="ac-label">Share</span>
      <span class="ac-sub">Personal Screen</span>
    </button>
  </div>

  <!-- Create Group Form (visible only for sellers, after Share) -->
  <div class="create-group-section" *ngIf="isSeller">
    <div class="cg-divider"><span>Seller — Create New Group</span></div>
    <div class="cg-form">
      <label class="form-lbl">Date From</label>
      <input type="date" class="form-input" [(ngModel)]="groupForm.dateFrom" />

      <label class="form-lbl">Date To</label>
      <input type="date" class="form-input" [(ngModel)]="groupForm.dateTo" />

      <label class="form-lbl">Select Plan</label>
      <div class="sel-wrap">
        <select class="form-sel" [(ngModel)]="groupForm.plan">
          <option value="" disabled>Select Plan</option>
          <option value="mobile">Mobile</option>
          <option value="standard">Standard</option>
          <option value="premium">Premium</option>
        </select>
      </div>

      <label class="form-lbl">Upload Subscription Screenshot</label>
      <div class="upload-box" (click)="uploadProof()">
        <ion-icon name="cloud-upload-outline"></ion-icon>
        <p class="up-text">{{ groupForm.proofFile ? groupForm.proofFile : 'Tap to Upload Screenshot' }}</p>
        <button class="up-btn" type="button">⬆ Upload</button>
      </div>

      <label class="form-lbl">Comments</label>
      <textarea class="comment-ta" [(ngModel)]="groupForm.comment" placeholder="Enter any comments here..."></textarea>

      <button class="create-btn" (click)="submitGroup()">
        <ion-icon name="add-circle-outline"></ion-icon>
        Create Group
      </button>
    </div>
  </div>

  <div style="height:80px"></div>
</ion-content>
