<ion-content class="val-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="settings-outline"></ion-icon></button>
    <div class="tab-pills"><div class="pill active"></div><div class="pill"></div><div class="pill"></div></div>
    <button class="icon-btn dark"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="logo-center"><div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div></div>
  <p class="page-title">Select Validity</p>
  <div class="app-banner" [style.background]="ottColor"><span>{{ ottName }}</span></div>
  <div class="val-list">
    <button class="val-row" *ngFor="let v of validities; let i=index" [class.hl]="selectedId===v.id" (click)="selectValidity(v)">
      <ion-icon name="calendar-outline" class="cal-icon"></ion-icon>
      <span class="val-label">{{ v.label }}</span>
      <span class="save-badge" *ngIf="i>0">SAVE ₹{{ v.saveUpto }}</span>
      <div class="val-price">₹{{ v.amount }} &gt;</div>
    </button>
  </div>
  <div class="proceed-wrap">
    <button class="yellow-btn proceed" (click)="proceed()" [disabled]="!selectedId">Proceed</button>
  </div>
  <div style="height:40px"></div>
</ion-content>
