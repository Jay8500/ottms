<ion-content class="support-content" [scrollY]="true">
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()"><ion-icon name="settings-outline"></ion-icon></button>
    <div class="logo-badge"><span class="money">Money</span><span class="saver">Saver</span></div>
    <button class="icon-btn dark"><ion-icon name="options-outline"></ion-icon></button>
  </div>
  <div class="contact-list">
    <button class="contact-btn" (click)="openInApp()">
      <div class="c-icon"><ion-icon name="headset-outline"></ion-icon></div><span>Support</span>
    </button>
    <button class="contact-btn" (click)="openWhatsApp()">
      <div class="c-icon"><ion-icon name="logo-whatsapp"></ion-icon></div><span>WhatsApp</span>
    </button>
    <button class="contact-btn" (click)="callSupport()">
      <div class="c-icon"><ion-icon name="call-outline"></ion-icon></div><span>Call Us</span>
    </button>
  </div>
  <div class="faq-section">
    <p class="faq-title">Frequently Asked Questions</p>
    <div class="faq-item" *ngFor="let f of faqs">
      <div class="faq-q" (click)="f.open=!f.open">
        <span>{{ f.q }}</span>
        <ion-icon [name]="f.open ? 'chevron-up-outline' : 'chevron-down-outline'"></ion-icon>
      </div>
      <div class="faq-a" *ngIf="f.open"><p>{{ f.a }}</p></div>
    </div>
  </div>
  <div style="height:80px"></div>
</ion-content>
